# Builds the Detective Paws Android app in the cloud, for free, every time you change a file
# (or when you press "Run workflow" in the Actions tab).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the test APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the test APK
        uses: actions/upload-artifact@v4
        with:
          name: DetectivePaws-test-APK
          path: app/build/outputs/apk/debug/*.apk

      # ---- Play Store version (only runs once you've added the 4 signing secrets) ----
      - name: Unpack the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

      - name: Build the Play Store release (AAB + signed APK)
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload the Play Store release
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: DetectivePaws-PlayStore-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
